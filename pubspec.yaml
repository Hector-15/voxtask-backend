name: voxtask
description: Asistente de tareas y recordatorios por voz.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0                     # API client
  speech_to_text: ^6.6.0          # on-device voice -> text
  flutter_tts: ^4.0.2             # spoken answers for voice search
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2                # tz-aware notification scheduling
  shared_preferences: ^2.2.2      # store JWT locally
  intl: ^0.19.0                   # date/time formatting (es)
  permission_handler: ^11.3.0     # mic + notification permissions

dev_dependencies:
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
